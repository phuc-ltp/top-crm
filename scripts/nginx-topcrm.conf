# Cấu hình Nginx mẫu cho TOP CRM (Ubuntu + PHP-FPM 8.2). Đặt tại /etc/nginx/sites-available/topcrm,
# sửa server_name và đường dẫn, rồi: ln -s ../sites-available/topcrm /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS miễn phí: apt install certbot python3-certbot-nginx && certbot --nginx -d crm.ten-mien-cua-ban.vn
server {
    listen 80;
    server_name crm.ten-mien-cua-ban.vn;
    root /var/www/topcrm/public;   # CHỈ thư mục public được phục vụ — mã nguồn, .env, storage nằm ngoài

    index index.php;
    charset utf-8;
    client_max_body_size 12m;      # vừa đủ cho tệp đính kèm (giới hạn ứng dụng: config/crm.php)
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Chặn mọi tệp ẩn (.env, .git...) và tệp sao lưu
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|zip|gz|bak|log)$ { deny all; }

    location ~* \.(css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}

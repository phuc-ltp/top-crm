<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mất kết nối · TOP CRM</title>
<meta name="theme-color" content="#9A4A1C">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #FFF7EF; color: #3B2414; text-align: center; }
    .box { max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { margin: 0 0 6px; color: #6B4A33; line-height: 1.5; }
    .en { font-size: 13px; color: #9C7B63; }
    button { margin-top: 18px; padding: 12px 26px; border: 0; border-radius: 12px; background: #D9823B; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
    <img src="icons/icon-192.png" alt="TOP CRM">
    <h1>Không có kết nối mạng</h1>
    <p>Hãy kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại. Dữ liệu CRM không được lưu trên máy để bảo mật.</p>
    <p class="en">You are offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Thử lại / Retry</button>
</div>
</body>
</html>
